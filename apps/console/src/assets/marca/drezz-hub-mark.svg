<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drezz Hub">
  <title>Drezz Hub</title>
  <defs>
    <!-- Entalhe superior-esquerdo (canto "pixel") como recorte real, para a marca
         funcionar sobre qualquer fundo, não só o creme. -->
    <mask id="dh-recorte">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="40" y="20" width="14" height="14" fill="#000"/>
    </mask>
  </defs>

  <g fill="#FF6732">
    <g mask="url(#dh-recorte)">
      <!-- haste esquerda da D -->
      <rect x="40" y="20" width="18" height="88" rx="2"/>
      <!-- bowl: meia-argola grossa, aberta à esquerda -->
      <path d="M49 20 H74 a44 44 0 0 1 0 88 H49 V90 h25 a26 26 0 0 0 0-52 H49 Z"/>
    </g>
    <!-- cauda em ponta (pin/balão) no canto inferior-esquerdo -->
    <path d="M41 90 L26 116 L59 103 Z"/>
    <!-- nós do "hub": o cluster de pixels da Drezz, agora lido como nós -->
    <rect x="17" y="53" width="11" height="11" rx="2"/>
    <rect x="3"  y="53" width="11" height="11" rx="2"/>
    <rect x="17" y="39" width="11" height="11" rx="2"/>
  </g>
</svg>
