<!doctype html>
<html lang="pt-BR">
  <head>
  <!-- ⚠️ Sem base href, o bundle é buscado RELATIVO à rota: /contato/x pedia /contato/main.js e a tela abria em branco no deep link. -->
  <base href="/">
    <meta charset="utf-8" />
    <title>Drezz Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FF6732" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- ⚠️ Anti-clickjacking, 2ª linha (a 1ª é o cabeçalho `frame-ancestors 'none'` + `X-Frame-Options: DENY`
         do nginx). `frame-ancestors` em <meta> é IGNORADO pelo navegador, por especificação — por isso aqui
         é script: dentro de iframe de terceiro, a página fica oculta e tenta sair do quadro. Exceção única: o
         formulário público `/f/<chave>`, feito para ser incorporado (mesmo formato que o nginx libera). -->
    <style id="anti-quadro">html { display: none !important; }</style>
    <script>
      (function () {
        var incorporavel = /^\/f\/[A-Za-z0-9_-]{16,40}$/.test(location.pathname);
        var emQuadro;
        try { emQuadro = window.self !== window.top; } catch (e) { emQuadro = true; }
        if (!emQuadro || incorporavel) {
          var s = document.getElementById('anti-quadro');
          if (s) s.parentNode.removeChild(s);
        } else {
          try { window.top.location = window.self.location; } catch (e) { /* bloqueado: segue oculto */ }
        }
      })();
    </script>
    <!-- Tipografia da identidade (ADR-012): Geist (interface) + Geist Mono
         (dados). Fallback gracioso para IBM Plex / system-ui se não carregar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
