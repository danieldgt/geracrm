server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ SSE do tempo real: sem buffering e com timeout longo, senão o nginx
    #    segura os eventos e a tela nunca atualiza. Prefixo mais específico que
    #    /v1, então ganha o match.
    location /v1/eventos {
        proxy_pass https://geracrm-api-production.up.railway.app;
        proxy_set_header Host geracrm-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ⚠️ A API é proxyada na MESMA origem do console — o browser fala só com o
    #    console, então não há CORS e o `/v1` relativo do app continua valendo.
    #    O `Authorization: Bearer` do Cognito é repassado (nginx encaminha headers).
    location /v1 {
        proxy_pass https://geracrm-api-production.up.railway.app;
        proxy_set_header Host geracrm-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ Landing page PÚBLICA do anúncio (AQ-44). Sem esta location a URL cairia
    #    no `location /` e o lead receberia o index.html do console — uma tela de
    #    login em vez da página que o anúncio prometeu.
    #    Fica na MESMA origem de propósito: o `fetch` da página chama
    #    `/publico/lp/:chave/sessao` relativo, então não há CORS.
    location /publico {
        proxy_pass https://geracrm-api-production.up.railway.app;
        proxy_set_header Host geracrm-api-production.up.railway.app;
        proxy_ssl_server_name on;
        # ⚠️ O limite de taxa da rota pública separa tráfego por IP — sem repassar
        #    o IP real, todo mundo divide o mesmo balde e o primeiro pico derruba
        #    a criação de sessão de todos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ Assets com HASH no nome (outputHashing:all): cache longo e imutável — o
    #    nome muda a cada build, então nunca serve versão velha.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ⚠️ index.html SEMPRE revalidado. Sem isto o browser reusa o índice antigo,
    #    que aponta para os JS antigos — e o usuário vê a UI velha depois do
    #    deploy (foi a causa do "ícone sumido" e afins). no-cache = revalida antes
    #    de usar; o deploy novo aparece na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ⚠️ /saude faz DOIS trabalhos: liveness do Railway (o railway.json é
    #    compartilhado com a API, então o healthcheckPath é um só) E a versão da
    #    API que o rodapé do console mostra ({ versao }). Por isso é PROXY para a
    #    API — e, se a API não responder, cai no "ok" local: o console continua
    #    vivo para o healthcheck e o rodapé mostra "—" em vez de derrubar o
    #    serviço junto. Sem o proxy, o rodapé lia "ok" e nunca via a versão.
    location = /saude {
        access_log off;
        proxy_pass https://geracrm-api-production.up.railway.app/saude;
        proxy_set_header Host geracrm-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @saude_local;
    }
    location @saude_local {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # SPA: qualquer rota do Angular (login, contatos, conversas…) cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
