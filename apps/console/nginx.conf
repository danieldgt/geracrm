server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ SSE do tempo real: sem buffering e com timeout longo, senão o nginx
    #    segura os eventos e a tela nunca atualiza. Prefixo mais específico que
    #    /v1, então ganha o match.
    location /v1/eventos {
        proxy_pass https://geracrm-api-production.up.railway.app;
        proxy_set_header Host geracrm-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ⚠️ A API é proxyada na MESMA origem do console — o browser fala só com o
    #    console, então não há CORS e o `/v1` relativo do app continua valendo.
    #    O `Authorization: Bearer` do Cognito é repassado (nginx encaminha headers).
    location /v1 {
        proxy_pass https://geracrm-api-production.up.railway.app;
        proxy_set_header Host geracrm-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota do Angular (login, contatos, conversas…) cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
